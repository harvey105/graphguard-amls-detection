    <style type="text/css">
      <![CDATA[

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1600px;
    height: 840px;
    background-color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    position: relative;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  
  svg.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 1600px;
    height: 840px;
    z-index: 5;
    pointer-events: none;
  }
  
  .card {
    position: absolute;
    display: flex;
    flex-direction: column;
    border-radius: 14px;
    overflow: hidden;
    border: 2.5px solid;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    z-index: 10;
  }
  
  .card-header {
    display: flex;
    align-items: center;
    border-bottom: 1.5px solid;
    flex-shrink: 0;
  }
  
  .badge {
    border-radius: 6px;
    font-weight: 800;
    color: #ffffff;
    white-space: nowrap;
    flex-shrink: 0;
    letter-spacing: 0.5px;
  }
  
  .title {
    font-weight: 800;
    color: #ffffff;
    white-space: nowrap;
    letter-spacing: 0.1px;
    overflow: visible;
  }
  
  .card-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  
  .bullet-p {
    margin: 0 0 13px 0;
    font-weight: 400;
    line-height: 1.34;
    color: #0f172a;
    display: flex;
    align-items: flex-start;
  }
  .bullet-p:last-child {
    margin: 0;
  }
  
  .bullet-icon {
    margin-right: 9px;
    line-height: 1.34;
    flex-shrink: 0;
  }
  
  .arrow-label {
    position: absolute;
    transform: translate(-50%, -100%);
    text-align: center;
    font-weight: 700;
    font-size: 15px;
    line-height: 1.25;
    background: #ffffff;
    padding: 4px 9px;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    border: 1px solid rgba(0,0,0,0.08);
    white-space: nowrap;
    z-index: 15;
  }
  
  .transition-pill {
    position: absolute;
    left: 340px;
    top: 350px;
    width: 920px;
    height: 50px;
    border-radius: 25px;
    background: #1e3a8a;
    border: 2px solid #3b82f6;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-weight: 700;
    font-size: 17.5px;
    letter-spacing: 0.3px;
    box-shadow: 0 4px 10px rgba(30, 58, 138, 0.2);
